<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Kashechewan First Nation emblem: a Canada goose in flight above flowing water">
  <circle cx="50" cy="50" r="48" fill="#143a31"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#e6b45c" stroke-width="2.5"/>
  <!-- goose in flight (niska) -->
  <g fill="#f8f3e9">
    <path d="M50 26
      C 47 30, 44 33, 40 34
      C 33 35, 26 33, 20 36
      C 27 38, 33 40, 38 44
      C 30 45, 23 49, 18 55
      C 27 53, 35 53, 42 56
      C 46 58, 49 61, 50 66
      C 51 61, 54 58, 58 56
      C 65 53, 73 53, 82 55
      C 77 49, 70 45, 62 44
      C 67 40, 73 38, 80 36
      C 74 33, 67 35, 60 34
      C 56 33, 53 30, 50 26 Z"/>
    <!-- head and neck -->
    <path d="M50 24 c -1.6 3.2 -1.6 6.4 0 9 c 1.6 -2.6 1.6 -5.8 0 -9 Z"/>
  </g>
  <!-- flowing water -->
  <g fill="none" stroke="#3d928c" stroke-width="2.4" stroke-linecap="round">
    <path d="M22 76 q 7 -6 14 0 t 14 0 t 14 0 t 14 0"/>
    <path d="M26 83 q 6 -5 12 0 t 12 0 t 12 0"/>
  </g>
</svg>
